<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link href="./stylesheets/reset.css" rel="stylesheet">
    <link href="./stylesheets/styles.css" rel="stylesheet">
</head>
<body>
    <div class="top-container">
        <div class="side-container">
            <div class="logo-container">
                <img src="./images/odin-lined.png" alt="The Odin Project Logo" id="logo-image">
                <div class="logo-text">ODIN</div>
            </div>
        </div>
        <div class="main-container">
            <div class="info-section">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.<br>Sign up now to get started.<br><br>You know you want to.</div>
            <form action="" method="post">
                <div class="form-main-section">
                    <h2 class="form-heading">Let's do this!</h2>
                    <div class="form-field">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div class="form-field">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                    <div class="form-field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-field">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" id="phone-number" name="phone-number">
                    </div>
                    <div class="form-field">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="form-field">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password">
                    </div>
                </div>
                <div class="form-submit-section">
                    <button type="submit" id="submit-button">Create Account</button>
                </div>
            </form>
            <p class="log-in">Already have an account? <a href="">Log in</a></p>
        </div>
    </div>
</body>
</html>
